
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>PAIHO-U Digital Design Workspace</title>
    <meta name="description" content="Advanced 3D sneaker material customization platform." />
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PAIHO-U Digital Design Workspace" />
    <meta property="og:description" content="Click, design, and experience the future of customization." />
    <meta property="og:image" content="https://raw.githubusercontent.com/yayapewn/shoe-textures/main/og-preview.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              'swipe-in-left': {
                '0%, 100%': { transform: 'translateX(-10px)' },
                '50%': { transform: 'translateX(10px)' }
              },
              'swipe-in-right': {
                '0%, 100%': { transform: 'translateX(10px)' },
                '50%': { transform: 'translateX(-10px)' }
              }
            },
            animation: {
              'swipe-in-left': 'swipe-in-left 2s ease-in-out infinite',
              'swipe-in-right': 'swipe-in-right 2s ease-in-out infinite'
            },
            colors: {
              primary: '#6366f1',
              secondary: '#f8f9fa',
              accent: '#10b981',
            }
          }
        }
      }
    </script>
    <style>
      body { 
        background-color: #f8f9fa; 
        margin: 0; 
        color: #1a1a1a; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior-y: none; /* 防止手機瀏覽器拉動重新整理 */
        user-select: none; /* 移除全域文字選取，避免出現文字遊標 */
        -webkit-user-select: none;
      }
      input {
        user-select: text; /* 恢復輸入框的選取功能 */
        -webkit-user-select: text;
      }
      #root { 
        height: 100vh;
        height: 100dvh; 
        width: 100vw; 
        overflow: hidden; 
      }
      /* Hide scrollbars for a cleaner UI */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* 處理 iOS 安全區域 */
      .safe-top { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.4",
    "react/": "https://esm.sh/react@19.2.4/",
    "react-dom": "https://esm.sh/react-dom@19.2.4",
    "react-dom/": "https://esm.sh/react-dom@19.2.4/",
    "three": "https://esm.sh/three@0.182.0",
    "three/": "https://esm.sh/three@0.182.0/",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.5.0?external=three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@10.7.7?external=three",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
